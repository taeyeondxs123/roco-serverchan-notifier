name: 洛克商人Bark推送
on:
  schedule:
    - cron: '5 0,4,8,12 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取数据并推送
        run: |
          # 获取商人信息
          DATA=$(curl -s "https://roco-api.entropy-increase.team/api/merchant" \
            -H "Authorization: Bearer ${{ secrets.ROCOM_API_KEY }}")
          
          # 组装推送内容
          if echo "$DATA" | grep -q '"status":"success"'; then
            if echo "$DATA" | grep -q '"goods":\[]'; then
              MSG="本次刷新：无稀有商品"
            else
              MSG=$(echo "$DATA" | jq -r '"刷新成功\n" + (.data.goods | map("- \(.name) x\(.count)") | join("\n"))')
            fi
          else
            MSG="获取数据失败"
          fi
          
          # 推送到Bark
          curl -s "https://api.day.app/${{ secrets.BARK_KEY }}/商人已刷新/$MSG"
